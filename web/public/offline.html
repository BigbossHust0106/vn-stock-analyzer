<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#376f5c" />
    <title>VN Stock · Ngoại tuyến</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(130deg, #e4f3e9, #e8dff6);
        font:
          16px/1.65 system-ui,
          sans-serif;
        color: #263a37;
      }
      main {
        max-width: 440px;
        background: #fff;
        border-radius: 28px;
        padding: 36px;
        border: 1px solid #dce6df;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
      }
      p {
        color: #657771;
      }
      a {
        display: inline-block;
        background: #376f5c;
        color: #fff;
        padding: 12px 20px;
        border-radius: 14px;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 20px;
        color: #657771;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="VN Stock" />
      <h1>Bạn đang ngoại tuyến</h1>
      <p>
        Giá chứng khoán, báo cáo tài chính và dữ liệu tài khoản cần kết nối
        mạng. Không có dữ liệu thị trường mới trong chế độ này.
      </p>
      <a href="/">Thử kết nối lại</a
      ><small>Chỉ mang tính tham khảo, không phải lời khuyên đầu tư.</small>
    </main>
  </body>
</html>
